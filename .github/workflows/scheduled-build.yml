name: Scheduled Pages build

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
