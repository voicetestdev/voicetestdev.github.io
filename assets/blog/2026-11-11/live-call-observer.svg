<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00B4D8"/>
    </marker>
  </defs>
  <rect width="760" height="440" rx="12" fill="#0a0a0a"/>

  <rect x="24" y="40" width="190" height="96" rx="8" fill="#141414" stroke="#262626"/>
  <text x="119" y="72" text-anchor="middle" fill="#fafafa" font-size="15" font-weight="600">Simulated caller</text>
  <text x="119" y="96" text-anchor="middle" fill="#888" font-size="12.5">persona from the test case</text>
  <text x="119" y="116" text-anchor="middle" fill="#888" font-size="12.5">speaks via TTS, listens via STT</text>

  <rect x="285" y="40" width="190" height="96" rx="8" fill="#141414" stroke="#00B4D8"/>
  <text x="380" y="72" text-anchor="middle" fill="#fafafa" font-size="15" font-weight="600">LiveKit room</text>
  <text x="380" y="96" text-anchor="middle" fill="#888" font-size="12.5">real WebRTC audio</text>
  <text x="380" y="116" text-anchor="middle" fill="#888" font-size="12.5">no human on the line</text>

  <rect x="546" y="40" width="190" height="96" rx="8" fill="#141414" stroke="#262626"/>
  <text x="641" y="72" text-anchor="middle" fill="#fafafa" font-size="15" font-weight="600">Your agent</text>
  <text x="641" y="96" text-anchor="middle" fill="#888" font-size="12.5">runs its graph</text>
  <text x="641" y="116" text-anchor="middle" fill="#888" font-size="12.5">STT → LLM → TTS</text>

  <line x1="216" y1="88" x2="281" y2="88" stroke="#888" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="248" y="80" text-anchor="middle" fill="#888" font-size="11">audio</text>
  <line x1="477" y1="88" x2="542" y2="88" stroke="#888" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="510" y="80" text-anchor="middle" fill="#888" font-size="11">audio</text>

  <rect x="285" y="196" width="190" height="80" rx="8" fill="#141414" stroke="#00B4D8"/>
  <text x="380" y="228" text-anchor="middle" fill="#00B4D8" font-size="15" font-weight="600">Observer</text>
  <text x="380" y="252" text-anchor="middle" fill="#888" font-size="12.5">transcribes the audio each</text>
  <text x="380" y="268" text-anchor="middle" fill="#888" font-size="12.5">side actually received</text>
  <line x1="380" y1="138" x2="380" y2="192" stroke="#00B4D8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="390" y="170" fill="#00B4D8" font-size="11">listens in</text>

  <path d="M641,138 L641,358 L480,358" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="652" y="240" fill="#888" font-size="11">intended text</text>
  <text x="652" y="255" fill="#888" font-size="11">(LLM output)</text>

  <rect x="190" y="300" width="286" height="116" rx="8" fill="#141414" stroke="#262626"/>
  <text x="333" y="326" text-anchor="middle" fill="#fafafa" font-size="15" font-weight="600">Result, one entry per turn</text>
  <text x="210" y="354" fill="#fafafa" font-size="12.5" font-family="'SF Mono', Monaco, monospace">content</text>
  <text x="290" y="354" fill="#888" font-size="12.5">what was meant</text>
  <text x="210" y="378" fill="#00B4D8" font-size="12.5" font-family="'SF Mono', Monaco, monospace">heard</text>
  <text x="290" y="378" fill="#888" font-size="12.5">what came through</text>
  <text x="210" y="402" fill="#888" font-size="12.5">+ a word-level diff of the two</text>
  <line x1="380" y1="278" x2="380" y2="296" stroke="#00B4D8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <rect x="24" y="300" width="140" height="116" rx="8" fill="#141414" stroke="#262626"/>
  <text x="94" y="326" text-anchor="middle" fill="#fafafa" font-size="15" font-weight="600">Judges</text>
  <text x="94" y="354" text-anchor="middle" fill="#888" font-size="12">test metrics</text>
  <text x="94" y="370" text-anchor="middle" fill="#888" font-size="12">on content</text>
  <text x="94" y="394" text-anchor="middle" fill="#00B4D8" font-size="12">audio metrics</text>
  <text x="94" y="410" text-anchor="middle" fill="#00B4D8" font-size="12">on heard</text>
  <line x1="188" y1="358" x2="168" y2="358" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
